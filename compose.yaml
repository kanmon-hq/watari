services:
  watari:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watari
    ports:
      - "8080:8080"
    environment:
      # ポート設定
      - HTTP_PORT=8080
      # 認証用共有シークレット（ローカル開発用）
      - GATEWAY_SHARED_SECRET=dev-gateway-shared-secret-local
      - ADMIN_API_KEY=dev-admin-api-key-local
      # ストレージ設定
      - STORAGE_BACKEND=memory
      - MEMORY_SEED_FILE=/app/examples/tenants.yaml
      # シークレットストア設定
      - SECRET_BACKEND=env
      # テナント用シークレット注入定義（examples/tenants.yaml に対応）
      - STRIPE_KEY_TENANT_A=sk_test_mock_stripe_key_tenant_a_12345
      - SENDGRID_KEY_TENANT_A=SG.mock_sendgrid_key_tenant_a_67890
      # ログ設定
      - LOG_LEVEL=debug
      - LOG_FORMAT=text
      # 開発用フラグ（モックコンテナ宛通信を許可）
      - ALLOW_PRIVATE_IPS=true
      - ALLOW_INSECURE_UPSTREAM=true
    volumes:
      - ./examples:/app/examples:ro
    depends_on:
      - stripe-mock
      - prism-mock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/livez"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Stripe公式モックサーバー (OpenAPI仕様に準拠)
  stripe-mock:
    image: stripe/stripe-mock:latest
    container_name: stripe-mock
    ports:
      - "12111:12111" # HTTP
      - "12112:12112" # HTTPS
    restart: unless-stopped

  # 汎用 OpenAPI モックサーバー (Stoplight Prism)
  prism-mock:
    image: stoplight/prism:5
    container_name: prism-mock
    ports:
      - "4010:4010"
    volumes:
      - ./examples/openapi:/specs:ro
    command: ["mock", "-h", "0.0.0.0", "/specs/api-spec.yaml"]
    restart: unless-stopped

