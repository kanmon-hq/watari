[package]
name = "watari"
version = "0.1.0"
edition = "2021"
description = "Egress proxy for outbound secret injection and SSRF guard"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
moka = { version = "0.12", features = ["future"] }
governor = { version = "0.8" }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"], optional = true }
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.8" }
subtle = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
url = { version = "2.5", features = ["serde"] }
http = "1.1"
http-body-util = "0.1"
bytes = "1.9"
futures-util = "0.3"
uuid = { version = "1.10", features = ["v4"] }
ipnet = "2.10"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# AWS SecretStore
aws-config = { version = "1.5", optional = true }
aws-sdk-secretsmanager = { version = "1.50", optional = true }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["sqlite"]
sqlite = ["dep:sqlx"]
aws = ["dep:aws-config", "dep:aws-sdk-secretsmanager"]
gcp = []     # Phase 4
azure = []   # Phase 4
