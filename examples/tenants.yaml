tenants:
  tenant-a:
    upstreams:
      stripe:
        # ローカルモック用: http://stripe-mock:12111 (本番用: https://api.stripe.com)
        base_url: "http://stripe-mock:12111"
        inject:
          - header: "Authorization"
            template: "Bearer {secret}"
            secret_ref: "STRIPE_KEY_TENANT_A"
            version: "latest"
        rate_limit:
          rpm: 100
          burst: 10
        timeout_secs: 30
      sendgrid:
        # ローカルモック用: http://prism-mock:4010 (本番用: https://api.sendgrid.com)
        base_url: "http://prism-mock:4010"
        inject:
          - header: "Authorization"
            template: "Bearer {secret}"
            secret_ref: "SENDGRID_KEY_TENANT_A"
            version: "latest"
        rate_limit:
          rpm: 60
          burst: 5
        timeout_secs: 15
